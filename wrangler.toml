name = "genidoc-hayat-api"
main = "backend/src/worker.js"
compatibility_date = "2024-12-16"

[env.development]
name = "genidoc-hayat-api-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "genidoc-hayat"
database_id = "YOUR_DATABASE_ID_HERE"
preview_database_id = "YOUR_PREVIEW_DATABASE_ID_HERE"

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_ID_HERE"
preview_id = "YOUR_KV_PREVIEW_ID_HERE"

[env.development.vars]
ENVIRONMENT = "development"
JWT_SECRET = "dev_jwt_secret_change_me"
JWT_REFRESH_SECRET = "dev_jwt_refresh_secret_change_me"
CORS_ORIGIN = "http://localhost:5173"

[env.production]
name = "genidoc-hayat-api"
routes = [
  { pattern = "api.genidoc.ma/*", zone_name = "genidoc.ma" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "genidoc-hayat"
database_id = "YOUR_DATABASE_ID_HERE"
preview_database_id = "YOUR_PREVIEW_DATABASE_ID_HERE"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_ID_HERE"
preview_id = "YOUR_KV_PREVIEW_ID_HERE"

[env.production.vars]
ENVIRONMENT = "production"
JWT_SECRET = "CHANGE_IN_CLOUDFLARE_DASHBOARD"
JWT_REFRESH_SECRET = "CHANGE_IN_CLOUDFLARE_DASHBOARD"
CORS_ORIGIN = "https://genidoc.vercel.app"

[[triggers.crons]]
cron = "0 2 * * *"

